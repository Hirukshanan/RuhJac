[project]
name = "RuhJac"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main.jac"
kind = "web-app"

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]

[client.app_meta_data]
title = "RuhJac — your study space"
description = "A calm place to plan coursework and make steady progress."
theme_color = "#525fc8"

[byllm.model]
default_model = "${GEMINI_MODEL:-gemini/gemini-3.8-flash}"
api_key = "${GEMINI_API_KEY:-}"
